# scatools benchmark dataset registry.
#
# aneuploidy: normal | quiet | moderate | high
# atac.format: fragments | peak_matrix | bin_matrix | fastq
# truth.type:  scDNA | bulk_wgs | multiome_gex | snp_array | karyotype
# status:      pending | downloaded | processed | benchmarked

datasets:

  - id: pbmc_5k_normal
    name: 10x PBMC 5k (healthy) scATAC
    cancer_type: none
    assay: scATAC
    aneuploidy: normal
    n_cells: ~4600
    genome: hg38
    atac:
      source: 10x
      url: https://cf.10xgenomics.com/samples/cell-atac/1.2.0/atac_pbmc_5k_nextgem/atac_pbmc_5k_nextgem_fragments.tsv.gz
      format: fragments            # ~961 MB, direct download, no cellranger
    truth:
      type: karyotype
      value: diploid
    notes: full run_scatools completes in ~3.6 min (4585 cells, 10Mb bins)
    status: downloaded

  # Fast dev/CI fixture: a random 300-cell subset of pbmc_5k_normal (real
  # fragments, NOT pre-filtered to bins, so it exercises the full binning path).
  # Regenerate with: benchmarks/scripts/make_mini.sh pbmc_5k_normal 300
  - id: pbmc_5k_normal_mini
    name: PBMC 5k mini (300-cell subset) — fast dev fixture
    cancer_type: none
    assay: scATAC
    aneuploidy: normal
    n_cells: 300
    genome: hg38
    role: dev_fixture              # full run_scatools in ~27s; for quick checks
    atac:
      source: derived             # make_mini.sh pbmc_5k_normal 300
      format: fragments           # ~40 MB
    truth:
      type: karyotype
      value: diploid
    status: downloaded

  - id: snu601
    name: SNU601 gastric carcinoma cell line
    cancer_type: gastric
    assay: scATAC
    aneuploidy: high
    n_cells: 3515
    genome: hg38
    atac:
      source: github
      url: https://github.com/seasoncloud/Alleloscope   # public processed data
      accession: PRJNA674903       # raw FASTQ (fallback)
      format: bin_matrix           # 200kb bin-by-cell + SNP ref/alt matrices
    truth:
      type: scDNA
      accession: PRJNA498809       # matched single-cell genome (Andor 2020)
    status: pending

  - id: colo320dm
    name: COLO320DM colorectal (MYC ecDNA)
    cancer_type: colorectal
    assay: multiome
    aneuploidy: high
    n_cells: ~72000
    genome: hg38
    atac:
      source: geo
      accession: GSE159986         # PRJNA672109; Hung et al. Nature 2021
      url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE159986
      format: matrix               # in GSE159986_RAW.tar (~18.7 GB)
    truth:
      type: bulk_wgs
    status: pending

  - id: hct116
    name: HCT116 colorectal (MSI, near-diploid)
    cancer_type: colorectal
    assay: multiome
    aneuploidy: quiet
    n_cells: ~few thousand
    genome: hg38
    atac:
      source: geo
      accession: VERIFY            # accession needs confirmation
      format: fastq
    truth:
      type: scWGS
      accession: PRJEB27084
    status: blocked
